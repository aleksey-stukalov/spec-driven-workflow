name: Workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: npm --prefix agentic_harness ci --ignore-scripts
      - run: uv run --locked python agentic_harness/tools/build.py --check
      - run: uv run --locked python agentic_harness/tools/check_render.py
      - run: uv run --locked python agentic_harness/tools/check_render.py --dark
      - run: uv run --locked pytest
      - run: node agentic_harness/tools/openspec.mjs validate --all --strict --no-interactive
